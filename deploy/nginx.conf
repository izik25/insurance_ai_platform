server {
    listen 80;
    server_name _;  # replace with your domain if you have one

    root /opt/insurance_ai_platform/frontend/dist;
    index index.html;

    # Dashboard API (api/routes.py) and public API (api/public_routes.py) -
    # proxied to the backend process so the browser sees everything as
    # same-origin (no CORS needed in production).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
