# Canonical Codes dictionary - v1
#
# Normalizes free-text phrases (from PolicyExtraction fields, question-bank
# answers, and canonical-profile text) into fixed internal codes so
# different companies' different wordings map to the same value. Consumed
# by core/knowledge_base/registry.normalize_to_code() (rule-based substring
# match first; unmatched phrases fall back to a small LLM-assisted batch,
# see core/canonical/code_normalizer.py in Phase 2).
#
# `disease`-derived insured_event codes are grounded directly in the live
# disease_list frequency table (data/processed/taxonomy_analysis/
# disease_list_frequencies.json) - the single most standardized closed
# vocabulary found in the corpus (e.g. סרטן=491, שבץ מוחי=443, טרשת
# נפוצה=312, עיוורון=283, אי ספיקת כליות כרונית=227, ...).
version: v1
